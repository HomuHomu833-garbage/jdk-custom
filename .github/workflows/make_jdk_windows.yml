name: Make JDK (Windows)
run-name: Make JDK ${{ inputs.jdk_version }} (Windows)
on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: "OpenJDK feature version"
        required: true
        default: "25"

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-jdk.yml
    secrets: inherit
    with:
      platform: windows
      jdk_version: ${{ inputs.jdk_version }}
      # The same five triples llvm-custom builds, all on the server JIT.
      # i686, armv7 and arm64ec each need hotspot work: a TLS get_thread for
      # i686, os_cpu/windows_arm for armv7, ARM64EC codegen for arm64ec.
      targets: >-
        ["aarch64-w64-mingw32", "i686-w64-mingw32", "x86_64-w64-mingw32",
         "armv7-w64-mingw32", "arm64ec-w64-mingw32"]
