name: Make JDK (Windows)
run-name: Make JDK ${{ inputs.jdk_version }} (Windows)
on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: "OpenJDK feature version"
        required: true
        default: "25"

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-jdk.yml
    secrets: inherit
    with:
      platform: windows
      jdk_version: ${{ inputs.jdk_version }}
      # Still to add: i686-w64-mingw32, armv7-w64-mingw32, arm64ec-w64-mingw32.
      # All three are wanted; none builds yet, and each needs hotspot work rather
      # than a build fix, so they are held out until the 64-bit targets are green
      # on every version.
      #
      # i686 fails the same way on 11, 17 and 21, and cannot exist on 25:
      # generated code loads the current thread through the SEH chain
      # (MacroAssembler::get_thread emits "movl reg, fs:[0]; movl reg, [reg +
      # thread_ptr_offset]"), and thread_ptr_offset comes from the MSVC inline
      # asm in os::os_exception_wrapper, valid only because every java call nests
      # inside its __try. clang cannot lower 32-bit mingw SEH: it emits
      # L__ehtable$ and $parent_frame_offset labels its asm printer never
      # defines, and -fseh-exceptions did not change that. Dropping the __try
      # would remove the very frame get_thread reads, so the JVM would link and
      # then follow a bogus thread pointer, with the guarding assert compiled out
      # in release. The fix is to reimplement get_thread on TLS. 25 is separate:
      # JEP 503 deleted the 32-bit x86 port outright, and there is no
      # os_cpu/windows_zero to stand in, so it needs that port backported.
      #
      # armv7 needs os_cpu/windows_arm written against the existing cpu/arm JIT.
      # arm64ec needs ARM64EC prologues and entry thunks out of the JIT.
      targets: >-
        ["x86_64-w64-mingw32", "aarch64-w64-mingw32"]
