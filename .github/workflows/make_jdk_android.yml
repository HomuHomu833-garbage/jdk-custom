name: Make JDK (Android)
run-name: Make JDK ${{ inputs.jdk_version }} (Android)
on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: "OpenJDK feature version (8 | 11 | 17 | 21 | 25)"
        required: true
        default: "25"
      ndk_version:
        description: "Official NDK version for the android clang"
        required: true
        default: "27"
      ndk_revision:
        description: "Official NDK revision letter (optional)"
        required: false
        default: "c"

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-jdk.yml
    secrets: inherit
    with:
      platform: android
      jdk_version: ${{ inputs.jdk_version }}
      ndk_version: ${{ inputs.ndk_version }}
      ndk_revision: ${{ inputs.ndk_revision }}
      # bionic has no HotSpot port, so every Android target is built as Zero
      # (runnable on-device, e.g. Termux). riscv64-linux-android can be added.
      targets: >-
        ["aarch64-linux-android", "armv7a-linux-androideabi",
         "x86_64-linux-android", "i686-linux-android"]
