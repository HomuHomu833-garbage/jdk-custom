name: Make JDK (macOS)
run-name: Make JDK ${{ inputs.jdk_version }} (macOS)
on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: "OpenJDK feature version"
        required: true
        default: "25"

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-jdk.yml
    secrets: inherit
    with:
      platform: macos
      jdk_version: ${{ inputs.jdk_version }}
      targets: >-
        ["x86_64-apple-darwin", "x86_64h-apple-darwin",
         "arm64-apple-darwin", "arm64e-apple-darwin"]
