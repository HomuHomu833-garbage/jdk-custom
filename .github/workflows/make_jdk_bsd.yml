name: Make JDK (BSD)
run-name: Make JDK ${{ inputs.jdk_version }} (BSD)
on:
  workflow_dispatch:
    inputs:
      jdk_version:
        description: "OpenJDK feature version (8 | 11 | 17 | 21 | 25)"
        required: true
        default: "25"

permissions:
  contents: write
  packages: read

jobs:
  make:
    uses: ./.github/workflows/make-jdk.yml
    secrets: inherit
    with:
      platform: bsd
      jdk_version: ${{ inputs.jdk_version }}
      # The BSD HotSpot ports are partial; expect per-target fixups under
      # patches/bsd/jdk. netbsd/openbsd aarch64 can be added once they build.
      targets: >-
        ["x86_64-freebsd-none", "aarch64-freebsd-none",
         "x86_64-netbsd-none", "x86_64-openbsd-none"]
